<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MindEase</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-side">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
        MindEase
      </a>
      <blockquote>"Feelings are just visitors. Let them come and go."</blockquote>
      <p class="small" style="opacity:.8">Welcome back. Take a breath — you showed up, and that counts.</p>
      <div class="blob"></div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to continue to your space.</p>

        <div id="error" class="form-error hidden" role="alert"></div>

        <form id="signin-form" novalidate>
          <div class="field">
            <label for="identifier">Username or email</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-target="password">Show</button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="switch">New to MindEase? <a href="/signup">Create an account</a></p>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
